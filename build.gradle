import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream
import org.gradle.internal.os.OperatingSystem

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.82'
    id 'idea'
    id "com.github.johnrengelman.shadow" version "8.1.1"
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()

    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven {
        name "CaffeineMC"
        url "https://maven.caffeinemc.net/releases" // or /snapshots
    }
    maven {
        url "https://cursemaven.com"
    }
    maven {
        url "https://maven.sinytra.org"
    }
}

base {
    archivesName = mod_id
}
// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'mixin.env.remapRefMap', 'true'
            systemProperty 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"


            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        create("sodium") {
            sourceSet(project(":common").sourceSets["main"])
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    //implementation "net.caffeinemc:sodium-neoforge-api:0.8.12-beta.2+mc1.21.1"
    implementation "net.caffeinemc:sodium-neoforge:0.8.12-beta.2+mc1.21.1"
    implementation "net.caffeinemc:sodium-neoforge-mod:0.8.12-beta.2+mc1.21.1"
    implementation("org.sinytra.forgified-fabric-api:fabric-api-base:0.4.42+d1308ded19")
    implementation("org.sinytra.forgified-fabric-api:fabric-renderer-api-v1:3.4.0+acb05a3919")
    implementation("org.sinytra.forgified-fabric-api:fabric-rendering-data-attachment-v1:0.3.48+73761d2e19")
    implementation("org.sinytra.forgified-fabric-api:fabric-block-view-api-v2:1.0.10+9afaaf8c19")

def lwjglVersion = "3.3.3"

    implementation("org.lwjgl:lwjgl-assimp:${lwjglVersion}") {
        exclude group: 'org.lwjgl', module: 'lwjgl'
        exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
        exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
        exclude group: 'org.lwjgl', module: 'lwjgl-stb'
    }

    clientAdditionalRuntimeClasspath("org.lwjgl:lwjgl-assimp:${lwjglVersion}") {
        exclude group: 'org.lwjgl', module: 'lwjgl'
        exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
        exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
        exclude group: 'org.lwjgl', module: 'lwjgl-stb'
    }

    shadow("org.lwjgl:lwjgl-assimp:${lwjglVersion}") {
        exclude group: 'org.lwjgl', module: 'lwjgl'
        exclude group: 'org.lwjgl', module: 'lwjgl-glfw'
        exclude group: 'org.lwjgl', module: 'lwjgl-opengl'
        exclude group: 'org.lwjgl', module: 'lwjgl-stb'
    }

    runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-windows"
    runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-linux"
    runtimeOnly "org.lwjgl:lwjgl-assimp:${lwjglVersion}:natives-macos"
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.register('moveFiles') {
    // 1. Capture the file providers during configuration phase to satisfy the cache engine
    def shadowJarFile = shadowJar.archiveFile
    def vanillaJarFile = jar.archiveFile
    def tempFileProvider = layout.buildDirectory.file("libs/output_temp.zip")

    // 2. Leave inputs/outputs completely empty so Gradle treats this as an action-only task.
    // The task will run every time it's called by the finalizedBy pipeline.

    doLast {
        // 3. Resolve the providers directly within the runtime block
        def inputFile = shadowJarFile.get().asFile
        def outputFile = vanillaJarFile.get().asFile
        def tempFile = tempFileProvider.get().asFile

        if (inputFile.exists() && outputFile.exists()) {
            def sourceZip = new ZipFile(inputFile)
            def destinationZip = new ZipFile(outputFile)
            def zipOut = new ZipOutputStream(new FileOutputStream(tempFile))

            // Copy existing contents of the destination ZIP to the temporary file
            destinationZip.entries().each { entry ->
                zipOut.putNextEntry(new ZipEntry(entry.getName()))
                zipOut.write(destinationZip.getInputStream(entry).readAllBytes())
                zipOut.closeEntry()
            }

            // Copy new files from the source ZIP that aren't already in the destination ZIP
            sourceZip.entries().each { entry ->
                if (destinationZip.getEntry(entry.getName()) == null) {
                    zipOut.putNextEntry(new ZipEntry(entry.getName()))
                    zipOut.write(sourceZip.getInputStream(entry).readAllBytes())
                    zipOut.closeEntry()
                } else {
                    println "File already exists in destination ZIP: ${entry.getName()}. Skipping."
                }
            }

            // Close all streams
            zipOut.close()
            sourceZip.close()
            destinationZip.close()

            // Safe file swap sequence
            if (outputFile.exists()) {
                outputFile.delete()
            }
            tempFile.renameTo(outputFile)
            inputFile.delete()

            println "Successfully merged shadow dependencies into the main mod jar."
        } else {
            println "Skipping merge: Shadow or target jar file not found."
        }
    }
}

build {
    dependsOn shadowJar
    finalizedBy moveFiles
}

tasks.register("bundleAllNativesForDistribution") {
    group = "build"
    description = "Bundles ONLY LWJGL Assimp natives into resources/natives"

    // Use a loose filter that filters safely based on the string name,
    // avoiding internal Gradle component class casting issues.
    def nativeJars = configurations.runtimeClasspath.incoming.artifactView {
        componentFilter { component ->
            def idStr = component.displayName.toString()
            return idStr.contains("org.lwjgl") && idStr.contains("lwjgl-assimp")
        }
    }.files

    inputs.files(nativeJars).withPropertyName("nativeJars")

    def outputRoot = layout.projectDirectory.dir("src/main/resources/natives")
    outputs.dir(outputRoot).withPropertyName("outputDirectory")

    doLast {
        def seen = new HashSet<String>()

        nativeJars.each { file ->
            // Double check that we are pulling the right native jar files
            if (!file.name.contains("lwjgl-assimp") || !file.name.contains("natives")) return

            println "Using Assimp native artifact file: ${file.name}"
            def zip = new ZipFile(file)

            zip.entries().each { entry ->
                if (entry.isDirectory()) return

                def fileName = entry.name.substring(entry.name.lastIndexOf('/') + 1)

                if (!(fileName.endsWith(".dll")
                        || fileName.endsWith(".so")
                        || fileName.endsWith(".dylib"))) {
                    return
                }

                def key = file.name + ":" + entry.name
                if (!seen.add(key)) return

                def dir = null

                if (fileName.endsWith(".dll")) {
                    dir = "windows/x86_64"
                } else if (fileName.endsWith(".so")) {
                    dir = "linux/x86_64"
                } else if (fileName.endsWith(".dylib")) {
                    dir = fileName.contains("arm")
                            ? "osx/arm64"
                            : "osx/x86_64"
                }

                if (dir == null) return

                def outDir = outputRoot.dir(dir).asFile
                outDir.mkdirs()

                def outFile = new File(outDir, fileName)

                outFile.withOutputStream { os ->
                    zip.getInputStream(entry).withStream {
                        it.transferTo(os)
                    }
                }

                println "Bundled ASSIMP ${fileName} -> ${dir}"
            }

            zip.close()
        }

        println "=== DONE (ASSIMP ONLY) ==="
    }
}

compileJava.dependsOn(bundleAllNativesForDistribution)
processResources.dependsOn(bundleAllNativesForDistribution)

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

shadowJar {
    // 1. Tell Shadow to ONLY look at dependencies added to the 'shadow' configuration
    configurations = [project.configurations.shadow]

    // 2. Prevent class name collisions by relocating shaded libraries if needed
    // relocate 'org.lwjgl.assimp', 'com.noodlegamer76.shadered.deps.assimp'

    // 3. Strip out signature files from dependency META-INF folders that break jar loading
    exclude 'META-INF/INDEX.LIST'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
}

// Tells the build lifecycle that assembling the project means executing shadowJar
assemble.dependsOn(shadowJar)
